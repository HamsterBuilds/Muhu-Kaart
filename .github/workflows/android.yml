name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npm run build:capacitor
        env:
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Setup Android native project
        run: |
          mkdir -p /tmp/android_backup
          cp -r android/app/src/main/res/values/strings.xml /tmp/android_backup/ 2>/dev/null || true
          cp -r android/app/src/main/AndroidManifest.xml /tmp/android_backup/ 2>/dev/null || true
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/res/values
          cp /tmp/android_backup/strings.xml android/app/src/main/res/values/strings.xml 2>/dev/null || true
          if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
            cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
      - name: Setup fixed debug keystore for consistent SHA-1
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - name: Add Firebase Android configuration
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON_B64 }}' | base64 --decode > android/app/google-services.json
          fi
      - run: npx cap sync android
      - name: Force the Firebase-registered signing certificate
        run: node scripts/configure-android-signing.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Verify APK signing certificate before release
        shell: bash
        run: |
          EXPECTED_SHA1=$(keytool -list -v -keystore android-debug.keystore -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1: //p' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')
          APK_SHA1=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*SHA1: //p' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')
          echo "Expected SHA-1: $EXPECTED_SHA1"
          echo "APK SHA-1:      $APK_SHA1"
          test -n "$EXPECTED_SHA1" && test "$APK_SHA1" = "$EXPECTED_SHA1"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
